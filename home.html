<head>
    <meta charset="UTF-8">

    <title>Sample Buttons</title>

    <style>
    section {
    position: fixed;     
    top: 50%;            
    left: 50%;          
    transform: translate(-50%, -50%);
    }
    .center {
        width: 250px;
        margin: 0 auto;
    }



    /* --- Sketchy Button 1 --- */

    .sketch-btn {
    padding: 14px 28px;
    margin: 8px 0px 15px 0px;
    min-width: 250px;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Comic Sans MS', cursive, sans-serif; /* Adds to the hand-drawn vibe */
    background: transparent;
    color: #111;
    cursor: pointer;
    
    /* Thick, slightly imperfect baseline border */
    border: 5px solid #ffffff;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    
    /* Applying the custom SVG filter above */
    filter: url(#sketchy-filter);
    transition: transform 0.2s ease;
    }

    .sketch-btn:hover {
    transform: scale(1.03) rotate(3deg);
    background-color: #e2e2e2;
    }




    /* --- Sketchy Button 2 --- */

    .shaky-pencil-btn {
    padding: 14px 28px;
    margin: 8px 0px 15px 0px;
    min-width: 250px;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Comic Sans MS', cursive, sans-serif; /* Adds to the hand-drawn vibe */
    background: transparent;
    color: #111;
    cursor: pointer;
    
    /* Thick, slightly imperfect baseline border */
    border: 5px solid #ffffff;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    
    /* Applying the custom SVG filter above */
    filter: url(#shaky-pencil);
    }

    .shaky-pencil-btn:hover {
    transform: scale(1.03) rotate(-2deg);
    background-color: #e6e6e6;
    }



m 
    /* --- Sketchy Button 3 --- */

    .liquid-edge-btn {
    padding: 14px 28px;
    margin: 8px 0px 15px 0px;
    min-width: 250px;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Comic Sans MS', cursive, sans-serif; /* Adds to the hand-drawn vibe */
    background: transparent;
    color: #111;
    cursor: pointer;
    
    /* Thick, slightly imperfect baseline border */
    border: 5px solid #ffffff;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    
    /* Applying the custom SVG filter above */
    filter: url(#liquid-edge);
    }

    .liquid-edge-btn:hover {
    transform: scale(1.03) rotate(4deg);
    background-color: #ffffff;
    }




    /* --- Sketchy Button 4 --- */

    .svg-btn {
    position: relative;
    margin: 8px 0px 15px 0px;
    min-width: 250px;
    height: 90px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    }

    /* Force the SVG to fill the button container completely */
    .btn-svg-shape {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    }

    .btn-svg-shape path {
    fill: #000000;         /* Button background color */
    stroke: #ffffff;       /* Button border color */
    stroke-width: 7px;       /* Thicker line for a hand-drawn vibe */
    stroke-linejoin: round;  /* Smooths out sharp vector joints */
    transition: all 0.3s ease;
    }

    /* Absolute text placement ensures it sits perfectly on top of the vector graphics */
    .btn-text {
    position: relative;
    z-index: 2;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Comic Sans MS', cursive, sans-serif; /* Adds to the hand-drawn vibe */
    color: #000000;
    letter-spacing: 0.5px;
    padding-bottom: 7px;
    }

    /* Hover effect: Change path color and fill */
    .svg-btn:hover .btn-svg-shape path {
    fill: #131313;
    stroke: #b9b9b9;
    }

    button.svg-btn:hover {
    transform: scale(1.03) rotate(-3deg);
    }
    </style>
